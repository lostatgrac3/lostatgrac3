<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" fill="none">
<style>
  .sans { font-family: -apple-system,'Segoe UI','Inter',system-ui,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace; }
  .lbl { font-family: ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace; font-size: 11px; letter-spacing: 1.2px; fill: #656d76; }
  .in { opacity: 0; animation: in .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>

<text x="0" y="62" class="sans in" font-size="46" font-weight="650" letter-spacing="-1.5" fill="#1f2328">lostatgrac3<tspan class="blink" fill="#4f6bd8">_</tspan></text>
<text x="1" y="100" class="sans in" style="animation-delay:0.15s" font-size="17" fill="#656d76">IT student at an HTL. Network automation, Linux and small tools.</text>
<rect x="1" y="128" width="998" height="1" fill="#eaeef2"/>
<rect x="1" y="128" width="140" height="1" fill="#4f6bd8" class="grow" style="animation-delay:0.35s"/>

</svg>