<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" fill="none">
<style>
  .sans { font-family: -apple-system,'Segoe UI','Inter',system-ui,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace; }
  .lbl { font-family: ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace; font-size: 11px; letter-spacing: 1.2px; fill: #7d8590; }
  .in { opacity: 0; animation: in .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<g class="in" style="animation-delay:0.05s"><text x="0" y="38" class="sans" font-size="30" font-weight="600" letter-spacing="-.5" fill="#e6edf3">254</text><text x="1" y="62" class="lbl">COMMITS</text></g>
